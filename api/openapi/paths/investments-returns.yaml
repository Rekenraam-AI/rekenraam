get:
  summary: Portfolio returns under returns_v1
  description: >
    R13 slices 1, 3, 4 and 5 (#119, docs/plans/investment-returns-plan.md). Time-weighted
    (TTWROR: daily linking, inflows at the start of the day, outflows at its
    end, valued on every day its validity needs) and money-weighted (IRR,
    Actual/365, solved only when Descartes' rule proves a unique root)
    returns of a set of accounts over `from`..`to`, in one
    reporting currency. The opening valuation is at the end of the day before
    `from`. External flows are postings outside the portfolio, netted per
    correction chain and day; external security transfers count at market
    value, never carried basis. Income and expense are performance, so
    returns are net of fees and taxes. An
    investment operation's cash is classified by the position its facts name
    (holding, or instrument held only inside or only outside), else by where
    its cash landed, and every such fallback is listed. A missing intermediate
    valuation removes only the time-weighted figures. The cumulative
    time-weighted series comes from the same chain, each point with its own
    reason. `allocation` splits the closing value by account, asset type
    and currency, long and short never netted. An optional `benchmark` (one
    security or crypto commodity, manual observations included) is read over
    the same series points. Read-only: nothing
    is posted, transferred or audited, and reconciliation is unaffected. One
    consistent disposable input snapshot; subsequent requests may restate the
    result. A figure missing an input is null with its reason, never zero.
  parameters:
    - name: from
      in: query
      required: true
      description: First day of the period (ISO date, inclusive).
      schema:
        type: string
        format: date
    - name: to
      in: query
      required: true
      description: Last day of the period (ISO date, inclusive, not after owner-local today).
      schema:
        type: string
        format: date
    - name: reporting_currency_id
      in: query
      required: true
      description: Currency every value and flow is converted into.
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: account_id
      in: query
      required: false
      description: Portfolio account (repeatable), expanded to its subtree as of `to`; each must be a non-system asset or liability. Omitted selects every investment container, investment cash, security holding and digital asset account with descendants.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64
          minimum: 1
    - name: max_staleness_days
      in: query
      required: false
      description: Inclusive on-or-before window for prices and FX.
      schema:
        type: integer
        minimum: 1
        maximum: 31
        default: 7
    - name: benchmark_commodity_id
      in: query
      required: false
      description: Security or crypto commodity to compare against, read as one unit held through the period and valued in the reporting currency.
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: benchmark_basis
      in: query
      required: false
      description: Which observations price the benchmark — `price_return` (raw prices, distributions excluded) or `total_return` (only observations recorded with adjustment basis total_return). Requires `benchmark_commodity_id`.
      schema:
        type: string
        enum: [price_return, total_return]
        default: price_return
  responses:
    "200":
      description: The returns read
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentReturnsResponse"
    "400":
      description: A date or currency is missing or malformed, `from` is after `to`, `to` is after owner-local today, an account is not a balance-sheet account, max_staleness_days is out of range, the benchmark is not a security or crypto commodity, or benchmark_basis is invalid or given without a benchmark
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "422":
      description: LEDGER_OVERFLOW — an amount the read must report exceeds the coefficient range at every scale that keeps it exact. It is refused rather than returned as a null figure without a reason.
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "503":
      description: Consistent input capture exceeded its deadline; RESOURCE_BUSY is retryable.
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
