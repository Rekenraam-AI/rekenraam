post:
  summary: Record cash in lieu of a fraction
  description: >-
    Disposes the fractional share (quantity below one) that a split, share
    exchange, cash-and-stock merger or spin-off left, for cash (T-147, #181):
    an ordinary long disposal under the holding's election, with the cash as
    proceeds. The security legs post on disposal_on and the cash on
    payment_on, as separate dated journal entries of one transaction. The
    disposal preserves the explicit original typed parent, dated on or before
    disposal_on, even if that parent was replaced or reversed. A split pins
    its original holding/instrument; other actions pin their original
    destination holding/instrument. Current parent context is advisory;
    actual dated quantity, basis and specific elections must replay successfully.
    Parent edits and disposal entry/correction retain gain and checkpoint review.
    The realized result comes from replay at the disposal slot; it is never
    a dividend. Invalid provenance is INVESTMENT_CASH_IN_LIEU_SPLIT_UNAVAILABLE.
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/CashInLieuRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "201":
      description: Disposal, both dated journal entries, settlement link and audit recorded atomically
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentTradeResponse"
    "400":
      description: Invalid facts
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Reconciliation override or gain acknowledgement required, settled operation unavailable, insufficient lots or out of order
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
