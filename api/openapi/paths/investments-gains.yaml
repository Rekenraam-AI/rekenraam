get:
  summary: List realized and unrealized investment gains
  description: >
    Returns all realized gains (from closed lot disposal events) and unrealized
    gains (from open positions vs. latest price). Realized gains can be filtered
    by disposal date. Unrealized gain fields are omitted when no price observation
    exists for the instrument. Effective return-of-capital allocation sets are
    included separately, filtered by payment date. Their unresolved excess is
    not included in disposal gains or totals; viewing does not post income.
    Unrealized gains are a read-only operational_v1 projection (R18, #230):
    without `valuation_as_of` they value today's positions; with it, every
    position is replayed to that date and priced with the latest compatible
    observation on or before it. `profile` names the rules used.
    Optional `alternative_method` adds an alternative_method_v1 projection beside
    the operational results. It replays effective history under FIFO, LIFO or
    average cost in a rolled-back read, including specific-lot decisions using
    the selected method. It never changes operational elections or journals.
  parameters:
    - name: from
      in: query
      required: false
      description: Start date filter for disposal gains and capital-return payments (ISO date, inclusive)
      schema:
        type: string
        format: date
    - name: to
      in: query
      required: false
      description: End date filter for disposal gains and capital-return payments (ISO date, inclusive)
      schema:
        type: string
        format: date
    - name: valuation_as_of
      in: query
      required: false
      description: >-
        Valuation date for unrealized gains (ISO date, not after owner-local
        today). Positions are replayed to that date under today's effective
        history; disposal-date filters are independent.
      schema:
        type: string
        format: date
    - name: alternative_method
      in: query
      required: false
      description: Read-only cost-basis comparison beside the operational result.
      schema:
        type: string
        enum: [fifo, lifo, average_cost]
    - name: reporting_currency_id
      in: query
      required: false
      description: Currency for an additive operational reporting projection; requires fx_method.
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: fx_method
      in: query
      required: false
      description: valuation_date_all converts signed basis and proceeds/market/income components at the valuation date (each boundary for statements). historic_basis_valuation_close converts each operational lot basis at its effective original acquisition date, proceeds/income at event date, and market value at valuation date. No provider requests or writes.
      schema:
        type: string
        enum: [valuation_date_all, historic_basis_valuation_close]
    - name: fx_max_age_days
      in: query
      required: false
      description: Inclusive maximum FX age in calendar days; requires reporting_currency_id and fx_method. Missing coverage leaves dependent figures and totals null, retaining originals.
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 7
  responses:
    "200":
      description: Realized and unrealized gains
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentGainsResponse"
    "400":
      description: The method, disposal period or valuation date is invalid, or the valuation date is after owner-local today
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: The alternative method cannot preserve a recorded structural lot entitlement; the operation is named.
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "422":
      description: The exact projection amount exceeds the supported range.
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
