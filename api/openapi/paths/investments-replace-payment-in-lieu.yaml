post:
  summary: Replace a posted payment in lieu of a dividend
  description: >-
    Posts the inverse and corrected payment under one audit event. Holding,
    instrument and ex-date are optional repairable attribution: omission
    preserves, null clears, and a value replaces. Payment date, cash account
    and currency stay fixed. Attribution-only repair nets to zero at every
    reconciliation boundary and does not change lots or gains. Historical
    short support and source disagreement are advisory diagnostics.
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InvestmentPaymentInLieuReplacementRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "201":
      description: Payment in lieu replaced
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentDividendReplacementResponse"
    "400":
      description: Invalid request or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted payment in lieu not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Already corrected (INVESTMENT_PAYMENT_IN_LIEU_ALREADY_CORRECTED), changed (INVESTMENT_PAYMENT_IN_LIEU_CHANGED), or reconciliation override required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "422":
      description: Exact financial value exceeds the supported range
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
