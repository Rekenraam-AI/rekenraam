ReturnsAmount:
  type: object
  description: A reporting-currency amount, or the reason (and dated breakpoint) it is unavailable.
  required: [amount, reason, date]
  properties:
    amount:
      oneOf:
        - $ref: "../../openapi.yaml#/components/schemas/BalanceQuantity"
        - type: "null"
    reason:
      type: [string, "null"]
      enum: [valuation_unavailable, flow_unavailable, unclassified_short, income_unattributable, unclassified_exchange, instrument_gain_unavailable, null]
    date:
      type: [string, "null"]
      format: date
ReturnFigure:
  type: object
  description: A return as a decimal fraction string rounded half away from zero to six places (0.090909 = 9.0909 %), or why it is unavailable.
  required: [value, reason, date]
  properties:
    value:
      type: [string, "null"]
      pattern: "^-?[0-9]+\\.[0-9]{6}$"
    reason:
      type: [string, "null"]
      enum: [valuation_unavailable, flow_unavailable, unclassified_short, non_positive_capital, no_capital, no_root, root_not_unique, numerical_limit, period_shorter_than_year, non_positive_growth, conflicting_splits, short_position, income_unattributable, unclassified_exchange, null]
    date:
      type: [string, "null"]
      format: date
ReturnsAttributionFallback:
  type: object
  description: Investment-operation cash the facts could not tie to one position, decided by where its cash landed. Nothing is written.
  required: [transaction_id, operation_id, operation_kind, date, reason, counted]
  properties:
    transaction_id:
      type: integer
      format: int64
    operation_id:
      type: integer
      format: int64
    operation_kind:
      type: string
    date:
      type: string
      format: date
    reason:
      type: string
      enum: [unassigned_instrument, held_inside_and_outside, not_held]
    counted:
      type: boolean
      description: Whether the cash entered the portfolio's return (it landed in a portfolio account).
ReturnsSeriesPoint:
  type: object
  description: The time-weighted return from the opening boundary through the end of `date`, or why it is unavailable.
  required: [date, time_weighted]
  properties:
    date:
      type: string
      format: date
    time_weighted:
      $ref: "../../openapi.yaml#/components/schemas/ReturnFigure"
ReturnsSeries:
  type: object
  description: >
    Cumulative time-weighted return at chart points, from the same exact
    chain as `time_weighted`; the last point is the closing day and equals
    it, or carries its reason. Points are the opening day, then every day
    (periods up to 92 days), every seventh day counted from the opening day
    (up to 731 days) or every calendar month end, and the closing day. A
    point applies the headline's failure policy as if it closed the period:
    an unknown flow, the opening valuation, its own valuation, the first
    other required valuation before it, then non-positive capital at or
    before it. A price gap only a point needs removes that point alone.
  required: [interval, points, valuation]
  properties:
    interval:
      type: string
      enum: [day, week, month]
    points:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ReturnsSeriesPoint"
    valuation:
      description: Coverage of the prices and rates only the chart points needed, apart from the headline `valuation`.
      $ref: "../../openapi.yaml#/components/schemas/Valuation"
ReturnsAllocationRow:
  type: object
  description: >
    One side of one group. By dimension exactly one key is meaningful:
    `account_id` (the outermost portfolio account), `asset_type`, or
    `currency_id` (null in the currency dimension for a security with no
    quote currency that day). Long and short balances are separate rows,
    never netted.
  required: [account_id, asset_type, currency_id, side, value, weight]
  properties:
    account_id:
      type: [integer, "null"]
      format: int64
    asset_type:
      type: [string, "null"]
      enum: [cash, stock, etf, fund, bond, option, future, crypto, other, unclassified, null]
    currency_id:
      type: [integer, "null"]
      format: int64
    side:
      type: string
      enum: [long, short]
    value:
      $ref: "../../openapi.yaml#/components/schemas/BalanceQuantity"
    weight:
      type: [string, "null"]
      pattern: "^-?[0-9]+\\.[0-9]{6}$"
      description: Share of `denominator` (six places, short rows negative); null when `weights_reason` is set.
ReturnsAllocationUnknown:
  type: object
  description: A balance with no usable price or rate on the day. Its units are known; it is in no weight.
  required: [account_id, quantity]
  properties:
    account_id:
      type: integer
      format: int64
    quantity:
      $ref: "../../openapi.yaml#/components/schemas/BalanceQuantity"
ReturnsAllocation:
  type: object
  description: >
    R13 slice 4. The closing value at `to` split by account, asset type and
    currency, from the same snapshot, scope and rates as `closing_value`.
    With every balance valued the denominator is the closing value
    (`basis: closing_value`); otherwise unpriced balances are listed in
    `unknown` and weights are of the known values only (`known_only`). A
    denominator of zero or less leaves every weight null. An unclassified
    short makes the whole allocation unavailable (`reason`).
  required: [date, reason, basis, denominator, weights_reason, by_account, by_asset_type, by_currency, unknown]
  properties:
    date:
      type: string
      format: date
    reason:
      type: [string, "null"]
      enum: [unclassified_short, null]
    basis:
      type: [string, "null"]
      enum: [closing_value, known_only, null]
    denominator:
      oneOf:
        - $ref: "../../openapi.yaml#/components/schemas/BalanceQuantity"
        - type: "null"
    weights_reason:
      type: [string, "null"]
      enum: [non_positive_value, null]
    by_account:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ReturnsAllocationRow"
    by_asset_type:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ReturnsAllocationRow"
    by_currency:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ReturnsAllocationRow"
    unknown:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ReturnsAllocationUnknown"
ReturnsBenchmark:
  type: object
  description: >
    One security or crypto commodity read as a single unit held through the
    period, valued in the reporting currency by its own rate table (its gaps
    never mark the portfolio's coverage incomplete). It has no flows, so its
    time-weighted return telescopes to the ratio of its end values; points are
    the portfolio series' dates. A missing opening value removes every point
    (dated the opening day); a missing point value removes that point. The
    headline is the closing point. `price_return` reads raw observations and
    excludes distributions; raw quotes are per unit of their own day, so the
    unit count follows the instrument's effective recorded splits (from any
    holding) and each value is priced in the basis of the quote it used,
    stale or not, so a split is neutral. A value whose quote-to-opening span
    crosses a day on which holdings record different factors is
    `conflicting_splits`, dated that day.
    For `price_return`, a trade-implied quote is first normalized to end-of-day
    units using the instrument-wide split factor still pending after its source trade's
    replay slot. If holdings disagree on that pending factor, the quote is
    unavailable with a `conflicting_splits` gap in benchmark valuation
    coverage, even if they agree on the day's total factor.
    `total_return` reads only observations recorded with adjustment basis
    total_return, a continuous series that is never split-adjusted. The basis
    is the request's declaration, never inferred.
  required: [commodity_id, basis, time_weighted, time_weighted_annualized, points, splits, valuation]
  properties:
    commodity_id:
      type: integer
      format: int64
    basis:
      type: string
      enum: [price_return, total_return]
    time_weighted:
      $ref: "../../openapi.yaml#/components/schemas/ReturnFigure"
    time_weighted_annualized:
      $ref: "../../openapi.yaml#/components/schemas/ReturnFigure"
    points:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ReturnsSeriesPoint"
    splits:
      type: array
      description: >
        Per-day split factors a price-return value used, in date order: splits
        within the period, and any between a stale quote and the opening day
        (up to the staleness window before it). A holding's successive splits
        on one day compound into one factor, in lowest terms. Always empty for
        total return.
      items:
        type: object
        required: [effective_on, ratio_numerator, ratio_denominator]
        properties:
          effective_on:
            type: string
            format: date
          ratio_numerator:
            type: string
            pattern: "^[1-9][0-9]*$"
          ratio_denominator:
            type: string
            pattern: "^[1-9][0-9]*$"
    valuation:
      $ref: "../../openapi.yaml#/components/schemas/Valuation"
InvestmentReturnsResponse:
  type: object
  required: [policy, from, to, opening_date, days, account_scope, resolved_account_ids, knowledge_cutoff, opening_value, closing_value, contributions, withdrawals, gain, time_weighted, time_weighted_annualized, money_weighted, money_weighted_period, time_weighted_series, allocation, benchmark, attribution_fallbacks, valuation]
  properties:
    policy:
      type: string
      enum: [returns_v1]
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    opening_date:
      type: string
      format: date
      description: The day whose end is the opening valuation (from − 1).
    days:
      type: integer
      description: Calendar days from the opening boundary to `to`.
    account_scope:
      type: string
      enum: [default_investment_accounts, selected_accounts]
    resolved_account_ids:
      type: array
      items:
        type: integer
        format: int64
    knowledge_cutoff:
      type: string
      format: date-time
    opening_value:
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAmount"
    closing_value:
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAmount"
    contributions:
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAmount"
    withdrawals:
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAmount"
    gain:
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAmount"
    time_weighted:
      $ref: "../../openapi.yaml#/components/schemas/ReturnFigure"
    time_weighted_annualized:
      $ref: "../../openapi.yaml#/components/schemas/ReturnFigure"
    money_weighted:
      $ref: "../../openapi.yaml#/components/schemas/ReturnFigure"
    money_weighted_period:
      $ref: "../../openapi.yaml#/components/schemas/ReturnFigure"
    time_weighted_series:
      $ref: "../../openapi.yaml#/components/schemas/ReturnsSeries"
    allocation:
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAllocation"
    benchmark:
      description: The requested benchmark, or null when none was requested.
      oneOf:
        - $ref: "../../openapi.yaml#/components/schemas/ReturnsBenchmark"
        - type: "null"
    instrument_returns:
      description: Present only when requested with `instruments=true`; requesting it changes no other field. Saved runs made without it omit the key.
      $ref: "../../openapi.yaml#/components/schemas/InstrumentReturns"
    attribution_fallbacks:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ReturnsAttributionFallback"
    valuation:
      $ref: "../../openapi.yaml#/components/schemas/Valuation"
InstrumentReturnsRow:
  type: object
  description: >
    One instrument's sleeve: its units in the portfolio scope, never cash,
    with the portfolio's own figures computed from the sleeve's values and
    flows. A trade's flow is all the cash paid or received for it, recognised
    on its trade date and converted on that date; income is a flow on its ex
    date when recorded, else its entry date; an exchange is valued at the
    consideration received. A sleeve that is short (a named short operation
    in the period, or a scope balance below zero at a day's end) keeps
    values, flows and gain, and its returns are `short_position`.
  required: [commodity_id, short, opening_value, closing_value, contributions, withdrawals, income, gain, time_weighted, time_weighted_annualized, money_weighted, money_weighted_period, valuation]
  properties:
    commodity_id:
      type: integer
      format: int64
    short:
      type: boolean
    opening_value:
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAmount"
    closing_value:
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAmount"
    contributions:
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAmount"
    withdrawals:
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAmount"
    income:
      description: Signed income attributed to the instrument (dividends, capital returns and reclaims positive; withholding-only payments and payments in lieu negative). Each also counts in contributions or withdrawals by its sign.
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAmount"
    gain:
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAmount"
    time_weighted:
      $ref: "../../openapi.yaml#/components/schemas/ReturnFigure"
    time_weighted_annualized:
      $ref: "../../openapi.yaml#/components/schemas/ReturnFigure"
    money_weighted:
      $ref: "../../openapi.yaml#/components/schemas/ReturnFigure"
    money_weighted_period:
      $ref: "../../openapi.yaml#/components/schemas/ReturnFigure"
    valuation:
      $ref: "../../openapi.yaml#/components/schemas/Valuation"
InstrumentIncomeNotAttributed:
  type: object
  description: Income recognised in the period that no sleeve carries.
  required: [transaction_id, operation_id, operation_kind, date, instrument_id, reason]
  properties:
    transaction_id:
      type: integer
      format: int64
    operation_id:
      type: integer
      format: int64
    operation_kind:
      type: string
    date:
      type: string
      format: date
    instrument_id:
      type: [integer, "null"]
      format: int64
    reason:
      type: string
      enum: [unassigned_instrument, not_held, held_inside_and_outside]
InstrumentReturns:
  type: object
  description: >
    Per-instrument returns (policy instrument_returns_v1), from the same
    snapshot as the portfolio figures. Sleeve returns are not weighted into
    the portfolio return.
  required: [policy, income_recognition, rows, not_attributed, not_attributed_gain]
  properties:
    policy:
      type: string
      enum: [instrument_returns_v1]
    income_recognition:
      type: string
      enum: [ex_date]
    rows:
      type: array
      description: Ordered by commodity code, then id.
      items:
        $ref: "../../openapi.yaml#/components/schemas/InstrumentReturnsRow"
    not_attributed:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/InstrumentIncomeNotAttributed"
    not_attributed_gain:
      description: The portfolio gain less every sleeve's gain — cash interest, FX on cash, unlinked fees, unattributed income and ex-date timing. A difference, never a computed breakdown; `instrument_gain_unavailable` when any gain is.
      $ref: "../../openapi.yaml#/components/schemas/ReturnsAmount"
