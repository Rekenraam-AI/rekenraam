SelfCheckResult:
  type: object
  description: >
    One check's verdict, in the terms a person needs: what was checked, what was
    found, where to look, and what to do about it. A failure a reader cannot act
    on is only half reported.
  required:
    - check_id
    - status
    - finding_count
    - sample
    - unavailable_count
    - unavailable_sample
    - warning_count
    - warning_sample
    - summary
    - explanation
    - next_step
  properties:
    check_id:
      type: string
      enum:
        - entry_balance
        - transaction_balance
        - book_balance
        - version_integrity
        - lot_reconciliation
        - commodity_position_sign
        - checkpoint_integrity
        - account_version_coverage
        - investment_foundation
        - investment_attribution
        - investment_replay_equivalence
        - price_dependency_integrity
        - sqlite_integrity
        - attachments
    status:
      type: string
      description: >
        failed means at least one integrity finding. warning means advisory
        contradictions without integrity findings. incomplete means no
        finding or warning, but some coverage could not be verified because the
        information is unknown (unavailable_count > 0) — neither passed nor
        corrupted. A failed check may also carry unavailable coverage; it is
        never downgraded by it. not_applicable is reserved for a check that
        cannot run yet — attachments until R14a. It never passes by default:
        passing a check nobody ran is how a coverage claim gets made by accident.
      enum: [passed, warning, incomplete, failed, not_applicable]
    finding_count:
      type: integer
      format: int64
      description: Integrity findings only. Unavailable coverage is counted separately.
    sample:
      type: array
      description: A capped sample of offending identifiers, for a human to go and look at. Diagnostic display only.
      items:
        type: integer
        format: int64
    unavailable_count:
      type: integer
      format: int64
      description: >
        Items the check could not verify because their information is unknown —
        for lot_reconciliation, lots (open or closed) with unknown projected
        basis. Zero on runs recorded before this was measured separately.
    unavailable_sample:
      type: array
      description: A capped sample of the identifiers behind unavailable_count. Diagnostic display only.
      items:
        type: integer
        format: int64
    warning_count:
      type: integer
      format: int64
      description: Advisory attribution contradictions, counted by reason, separate from integrity findings and unavailable coverage. Zero on older runs.
    warning_sample:
      type: array
      description: Capped sample of named payment warnings. Each reason may name the same transaction.
      items:
        type: object
        required: [transaction_id, reason]
        properties:
          transaction_id:
            type: integer
            format: int64
          reason:
            type: string
            enum: [no_short_at_entitlement_close, ex_date_after_payment]
    summary:
      type: string
    explanation:
      type: string
      description: What this check verifies and why it matters.
    next_step:
      type: string
      description: What to do when it fails. The check never repairs anything itself.
SelfCheckRun:
  type: object
  required:
    - id
    - trigger
    - status
    - failed_check_count
    - incomplete_check_count
    - warning_check_count
    - error_summary
    - started_at
    - results
  properties:
    id:
      type: integer
      format: int64
    trigger:
      type: string
      enum: [manual, scheduled]
      description: scheduled runs are chained onto a successful nightly backup.
    status:
      type: string
      description: >
        Precedence over completed results: failed if any result failed, else
        warning if any result has warnings, else incomplete if any result has unavailable coverage, else passed. errored
        means the check could not complete; it is not a ledger-failure verdict.
        Recorded verdicts are history and are never restated.
      enum: [passed, warning, incomplete, failed, errored]
    failed_check_count:
      type: integer
      format: int64
    incomplete_check_count:
      type: integer
      format: int64
      description: >
        Results with unavailable coverage, including failed results that also
        have some. Lets a failed run disclose what it could not verify.
    warning_check_count:
      type: integer
      format: int64
      description: Results with advisory warnings, including failed results that also have warnings.
    error_summary:
      type: string
      description: Diagnostic reason when status is errored; otherwise empty.
    started_at:
      type: string
      format: date-time
    finished_at:
      type: string
      format: date-time
    results:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/SelfCheckResult"
SelfCheckStatusResponse:
  type: object
  required:
    - has_run
    - read_only
  properties:
    has_run:
      type: boolean
      description: >
        False for a book that has never been checked. That is a real answer —
        "not checked yet" — and not an error, so a screen can say it instead of
        showing an empty table that looks like a pass.
    read_only:
      type: boolean
      description: Always true. The check reports and explains; it never repairs.
    latest_run:
      $ref: "../../openapi.yaml#/components/schemas/SelfCheckRun"
