# Disposable HTTPS reverse-proxy deployment for the #268 audit.
#
# Layered over the supplied Compose file so the app container is exactly the
# documented one; this file only adds a Caddy proxy with a local CA and the
# proxy-trust settings. Synthetic data only. See README.md for the recipe.
# Compose resolves relative paths against the first file's directory
# (deploy/docker), hence ./proxy-audit/Caddyfile below.
#
#   docker compose -p rr-proxy-audit \
#     -f deploy/docker/compose.yaml -f deploy/docker/proxy-audit/compose.yaml up -d --build
services:
    rekenraam:
        environment:
            TRUST_PROXY_HEADERS: "1"
            # Exactly the proxy container's address, never the network.
            TRUSTED_PROXY_CIDRS: 172.31.68.10/32
        networks:
            edge:
                ipv4_address: 172.31.68.20

    proxy:
        image: caddy:2.11.4-alpine
        depends_on:
            - rekenraam
        ports:
            - "127.0.0.1:8443:443"
        volumes:
            - ./proxy-audit/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
        networks:
            edge:
                ipv4_address: 172.31.68.10

networks:
    edge:
        ipam:
            config:
                - subnet: 172.31.68.0/24

volumes:
    caddy-data:
